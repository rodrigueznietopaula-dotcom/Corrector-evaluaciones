<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corrector de evaluaciones</title>
<style>
:root{--c:#1f4e79;--ok:#1b9e4b;--bad:#d33}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f4f6f8;color:#222}
header{background:var(--c);color:#fff;padding:10px 14px}header h1{margin:0 0 6px;font-size:1.15rem}
nav{display:flex;gap:4px;padding:8px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
nav button{flex:1;padding:10px 4px;border:0;background:#eee;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--c);color:#fff}
main{max-width:900px;margin:auto;padding:12px}
section{display:none}section.on{display:block}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
label{display:block;font-size:.85rem;margin:8px 0 3px;color:#555}
input,select,textarea{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px;font:inherit}
.btn{background:var(--c);color:#fff;border:0;padding:11px 16px;border-radius:8px;font:inherit;cursor:pointer;margin:8px 6px 0 0;display:inline-block}
.btn.g{background:#e3e8ee;color:#222}
.video{position:relative;background:#000;border-radius:10px;overflow:hidden}
.video video,.video canvas{display:block;width:100%;height:auto}.video canvas{position:absolute;inset:0}
#res canvas{width:100%;height:auto;border-radius:8px;margin-top:8px}
.big{font-size:1.4rem;font-weight:700}.warn{color:#b35c00}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
.sheet{position:relative;width:210mm;height:297mm;background:#fff;margin:auto;box-shadow:0 1px 6px #0004;color:#000;font-family:Arial,sans-serif;overflow:hidden}
.sheet *{position:absolute}.mk{width:10mm;height:10mm;background:#000}
.bb{width:6mm;height:6mm;border:.35mm solid #000;border-radius:50%}
.qn{width:12mm;text-align:right;font-size:3.2mm;line-height:6mm}
.lt{width:6mm;text-align:center;font-size:3.2mm;font-weight:bold}
@page{size:A4;margin:0}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card{box-shadow:none;padding:0;margin:0}.sheet{box-shadow:none}}
</style></head><body>
<header><h1>📝 Corrector de evaluaciones</h1>
<select id="ex"></select></header>
<nav id="nav"><button data-s="scan" class="on">Escanear</button><button data-s="hoja">Hoja</button><button data-s="conf">Clave</button><button data-s="rs">Resultados</button></nav>
<main>
<section id="scan" class="on"><div class="card">
<div class="video"><video id="V" playsinline muted></video><canvas id="OV"></canvas></div>
<div id="st" style="margin-top:6px;font-size:.9rem">Cámara apagada.</div>
<button class="btn" id="bcam">Iniciar cámara</button>
<button class="btn" id="bgo">Calificar</button>
<label class="btn g" style="margin-bottom:0">Subir foto<input type="file" id="fi" accept="image/*" hidden></label>
</div>
<div class="card" id="res" hidden>
<div id="sum"></div><div id="rev" class="warn"></div>
<label>Nombre del estudiante</label><input id="nm" placeholder="Nombre y curso">
<button class="btn" id="bsave">Guardar resultado</button>
<div id="cvh"></div></div></section>

<section id="hoja"><div class="card">
<p class="noprint">Imprime esta hoja en tamaño A4 al 100 % (sin "ajustar a la página") y sin márgenes. Sirve para la evaluación seleccionada arriba.</p>
<button class="btn noprint" onclick="print()">Imprimir hoja</button>
<div class="sheet" id="sheet"></div></div></section>

<section id="conf"><div class="card">
<label>Número de preguntas (máx. 60)</label><input type="number" id="cn" min="1" max="60">
<label>Opciones por pregunta</label><select id="co"><option>4</option><option>5</option></select>
<label>Clave de respuestas (ej: ABCDDABC…)</label><textarea id="ck" rows="3" style="text-transform:uppercase"></textarea>
<div id="ks" style="margin-top:6px"></div></div></section>

<section id="rs"><div class="card">
<button class="btn" id="bcsv">Descargar CSV</button>
<div style="overflow:auto"><table id="tb"></table></div></div></section>
</main>
<script>
/* ---------- Geometría de la hoja (mm), medida desde el centro del marcador superior izquierdo ---------- */
const OX=15,OY=15,AW=180,AH=255,ROWS=20;
const pos=(q,k)=>[Math.floor(q/ROWS)*58+20+k*9, 50+(q%ROWS)*9];
const $=id=>document.getElementById(id);
/* ===== CLAVES INTEGRADAS: edita aquí (n = preguntas, o = opciones, key = letras en orden) ===== */
const EXAMENES=[
 {name:"Nivelación sexto español",n:25,o:4,key:"BCADCABDBACAABDCCBDABDCCB"},
 {name:"Nivelación décimo español",n:19,o:4,key:"BDACDACBDCABDABCBDA"},
 {name:"Nivelación habilidades comunicativas décimo",n:20,o:4,key:""},
 {name:"Nivelación habilidades comunicativas once",n:20,o:4,key:""}];
/* ================================================================================================ */
let S;try{S=JSON.parse(localStorage.getItem('cev'))}catch(e){}
if(!S||!S.exams||S.exams.length!=EXAMENES.length)S={exams:EXAMENES.map(x=>({...x,key:''})),res:[],sel:0};
S.exams.forEach((e,i)=>{const x=EXAMENES[i];e.name=x.name;if(x.key){e.n=x.n;e.o=x.o;e.key=x.key}});
const save=()=>localStorage.setItem('cev',JSON.stringify(S));
const cur=()=>S.exams[S.sel];
/* ---------- UI ---------- */
$('ex').innerHTML=S.exams.map((e,i)=>`<option value="${i}">${e.name}</option>`).join('');
$('ex').value=S.sel;
$('ex').onchange=()=>{S.sel=+$('ex').value;save();refresh()};
$('nav').onclick=e=>{const s=e.target.dataset.s;if(!s)return;document.querySelectorAll('section').forEach(x=>x.classList.toggle('on',x.id==s));
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b==e.target))};
function refresh(){const e=cur();$('cn').value=e.n;$('co').value=e.o;$('ck').value=e.key;
 const L=!!EXAMENES[S.sel].key;['cn','co','ck'].forEach(i=>$(i).disabled=L);keyInfo();sheet();table()}
function keyInfo(){const e=cur(),ok=e.key.length>=e.n;$('ks').innerHTML=ok?`<span style="color:var(--ok)">✔ Clave completa (${e.n})</span>`:`<span class="warn">Clave: ${e.key.length} de ${e.n} respuestas</span>`}
$('cn').onchange=()=>{cur().n=Math.max(1,Math.min(60,+$('cn').value||20));save();refresh()};
$('co').onchange=()=>{cur().o=+$('co').value;cur().key=cur().key.replace(/[^A-D]/g,'').slice(0,60);save();refresh()};
$('ck').oninput=()=>{const e=cur();e.key=$('ck').value.toUpperCase().replace(/[^A-E]/g,'').slice(0,60);save();keyInfo()};
function sheet(){const e=cur(),L='ABCDE';let h='';
 [[10,10],[190,10],[10,265],[190,265]].forEach(p=>h+=`<div class="mk" style="left:${p[0]}mm;top:${p[1]}mm"></div>`);
 h+=`<div style="left:25mm;top:20mm;width:160mm;font-size:5mm;font-weight:bold">${e.name}</div>`;
 h+=`<div style="left:25mm;top:31mm;width:160mm;font-size:3.6mm">Nombre: ______________________________________ Curso: ________</div>`;
 h+=`<div style="left:25mm;top:40mm;width:160mm;font-size:3.6mm">Fecha: ______________ &nbsp; Rellena por completo el círculo con esfero o lápiz oscuro.</div>`;
 for(let c=0;c<Math.ceil(e.n/ROWS);c++)for(let k=0;k<e.o;k++){const[u]=pos(c*ROWS,k);h+=`<div class="lt" style="left:${OX+u-3}mm;top:${OY+43}mm">${L[k]}</div>`}
 for(let q=0;q<e.n;q++){const[u0,v]=pos(q,0);h+=`<div class="qn" style="left:${OX+u0-18}mm;top:${OY+v-3}mm">${q+1}.</div>`;
  for(let k=0;k<e.o;k++){const[u]=pos(q,k);h+=`<div class="bb" style="left:${OX+u-3}mm;top:${OY+v-3}mm"></div>`}}
 $('sheet').innerHTML=h}
/* ---------- Visión: binarizado adaptativo + marcadores + homografía ---------- */
function analyze(src,maxW){
 const sw=src.videoWidth||src.naturalWidth,sh=src.videoHeight||src.naturalHeight;
 const w=Math.min(maxW,sw),h=Math.round(sh*w/sw),cv=document.createElement('canvas');cv.width=w;cv.height=h;
 const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(src,0,0,w,h);
 const d=cx.getImageData(0,0,w,h).data,N=w*h,g=new Uint8Array(N);
 for(let i=0;i<N;i++)g[i]=(d[4*i]*77+d[4*i+1]*151+d[4*i+2]*28)>>8;
 const W1=w+1,I=new Uint32Array(W1*(h+1));
 for(let y=0;y<h;y++){let s=0;for(let x=0;x<w;x++){s+=g[y*w+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+s}}
 const k=Math.max(8,w/20|0),bin=new Uint8Array(N);
 for(let y=0;y<h;y++){const y0=Math.max(0,y-k),y1=Math.min(h,y+k+1);
  for(let x=0;x<w;x++){const x0=Math.max(0,x-k),x1=Math.min(w,x+k+1);
   const a=(I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0])/((x1-x0)*(y1-y0));
   bin[y*w+x]=g[y*w+x]<a*.8&&g[y*w+x]<190?1:0}}
 const lab=new Uint8Array(N),st=new Int32Array(N),C=[];
 for(let i=0;i<N;i++){if(!bin[i]||lab[i])continue;
  let sp=0,n=0,sx=0,sy=0,x0=w,x1=0,y0=h,y1=0;st[sp++]=i;lab[i]=1;
  while(sp){const p=st[--sp],x=p%w,y=(p-x)/w;n++;sx+=x;sy+=y;
   if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
   if(x>0&&bin[p-1]&&!lab[p-1]){lab[p-1]=1;st[sp++]=p-1}
   if(x<w-1&&bin[p+1]&&!lab[p+1]){lab[p+1]=1;st[sp++]=p+1}
   if(y>0&&bin[p-w]&&!lab[p-w]){lab[p-w]=1;st[sp++]=p-w}
   if(y<h-1&&bin[p+w]&&!lab[p+w]){lab[p+w]=1;st[sp++]=p+w}}
  const bw=x1-x0+1,bh=y1-y0+1;
  if(bw>w*.015&&bw<w*.12&&bh>w*.015&&bh<w*.12&&bw/bh>.7&&bw/bh<1.4&&n/(bw*bh)>.86)C.push([sx/n,sy/n])}
 const a={cv,cx,bin,w,h,pts:null};
 if(C.length>=4){const by=f=>C.reduce((m,p)=>f(p)<f(m)?p:m);
  const tl=by(p=>p[0]+p[1]),br=by(p=>-p[0]-p[1]),tr=by(p=>p[1]-p[0]),bl=by(p=>p[0]-p[1]);
  const r=Math.hypot(tl[0]-tr[0],tl[1]-tr[1])/Math.hypot(tl[0]-bl[0],tl[1]-bl[1]);
  if(new Set([tl,tr,bl,br]).size==4&&r>.5&&r<.95)a.pts=[tl,tr,bl,br]}
 return a}
function homog(P,Q){const A=[];P.forEach(([u,v],i)=>{const[x,y]=Q[i];A.push([u,v,1,0,0,0,-u*x,-v*x,x],[0,0,0,u,v,1,-u*y,-v*y,y])});
 for(let i=0;i<8;i++){let m=i;for(let r=i+1;r<8;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];
  for(let r=0;r<8;r++)if(r!=i){const f=A[r][i]/A[i][i];for(let c=i;c<9;c++)A[r][c]-=f*A[i][c]}}
 const h=A.map((r,i)=>r[8]/r[i]);
 return(u,v)=>{const z=h[6]*u+h[7]*v+1;return[(h[0]*u+h[1]*v+h[2])/z,(h[3]*u+h[4]*v+h[5])/z]}}
function fill(a,cx,cy,r){let t=0,d=0;
 for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){
  if((x-cx)**2+(y-cy)**2>r*r||x<0||y<0||x>=a.w||y>=a.h)continue;t++;d+=a.bin[y*a.w+x]}
 return t?d/t:0}
/* ---------- Calificación ---------- */
let pend=null;
function grade(a){
 const e=cur(),[tl,tr,bl,br]=a.pts,dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
 const H=homog([[0,0],[AW,0],[0,AH],[AW,AH]],a.pts);
 const sc=(dist(tl,tr)/AW+dist(bl,br)/AW+dist(tl,bl)/AH+dist(tr,br)/AH)/4,rr=1.8*sc;
 const ans=[];let ok=0;const rev=[],cx=a.cx;cx.lineWidth=Math.max(2,sc*.5);
 for(let q=0;q<e.n;q++){
  const f=[];for(let k=0;k<e.o;k++){const[x,y]=H(...pos(q,k));f.push(fill(a,x,y,rr))}
  const m=f.map((v,k)=>v>.5?k:-1).filter(k=>k>=0);
  const sel=m.length==1?m[0]:(m.length?-2:-1),key=e.key.charCodeAt(q)-65,good=sel==key;
  ans.push(sel<0?(sel==-2?'*':'-'):'ABCDE'[sel]);if(good)ok++;
  if(sel==-1)rev.push(`${q+1} (en blanco)`);if(sel==-2)rev.push(`${q+1} (doble marca)`);
  if(key>=0&&key<e.o){const[x,y]=H(...pos(q,key));cx.strokeStyle='#1b9e4b';cx.beginPath();cx.arc(x,y,rr*1.5,0,7);cx.stroke()}
  if(sel>=0&&!good){const[x,y]=H(...pos(q,sel));cx.strokeStyle='#d33';cx.beginPath();cx.arc(x,y,rr*1.5,0,7);cx.stroke()}}
 const nota=(5*ok/e.n).toFixed(1);
 pend={exam:e.name,ok,n:e.n,nota,ans:ans.join(''),date:new Date().toLocaleString('es-CO')};
 $('res').hidden=false;
 $('sum').innerHTML=`<div class="big">${ok} / ${e.n} aciertos · Nota ${nota}</div>`+(e.key.length<e.n?'<div class="warn">⚠ La clave está incompleta.</div>':'');
 $('rev').textContent=rev.length?'Revisar: '+rev.join(', '):'';
 $('cvh').innerHTML='';$('cvh').appendChild(a.cv);$('res').scrollIntoView({behavior:'smooth'})}
function run(src){const a=analyze(src,1280);
 if(!a.pts){$('st').innerHTML='<span class="warn">No se ven los 4 cuadros negros de las esquinas. Aleja un poco la hoja, mejora la luz y evita sombras.</span>';return}
 grade(a)}
$('bsave').onclick=()=>{if(!pend)return;pend.name=$('nm').value.trim()||'Sin nombre';S.res.push(pend);pend=null;save();$('nm').value='';$('res').hidden=true;table();$('st').textContent='Guardado ✔ Siguiente estudiante.'};
/* ---------- Cámara ---------- */
const V=$('V'),OV=$('OV');let timer;
$('bcam').onclick=async()=>{try{
 V.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});
 await V.play();clearInterval(timer);timer=setInterval(live,350);$('bcam').textContent='Cámara activa'}
 catch(err){$('st').innerHTML='<span class="warn">No se pudo abrir la cámara: '+err.message+'</span>'}};
function live(){if(!V.videoWidth)return;const a=analyze(V,480),c=OV.getContext('2d');
 OV.width=V.videoWidth;OV.height=V.videoHeight;
 if(a.pts){const s=V.videoWidth/a.w,[tl,tr,bl,br]=a.pts;c.strokeStyle='#2f2';c.lineWidth=5;c.beginPath();
  [tl,tr,br,bl,tl].forEach((p,i)=>i?c.lineTo(p[0]*s,p[1]*s):c.moveTo(p[0]*s,p[1]*s));c.stroke();
  $('st').innerHTML='<span style="color:var(--ok)">✔ Hoja detectada: toca "Calificar".</span>'}
 else $('st').textContent='Buscando los 4 cuadros negros de la hoja…'}
$('bgo').onclick=()=>V.videoWidth?run(V):$('st').textContent='Primero inicia la cámara o sube una foto.';
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{run(im);URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f);e.target.value=''};
/* ---------- Resultados ---------- */
function table(){$('tb').innerHTML='<tr><th>Evaluación</th><th>Estudiante</th><th>Nota</th><th>Aciertos</th><th></th></tr>'+
 S.res.map((r,i)=>`<tr><td>${r.exam.replace('Nivelación ','')}</td><td>${r.name}</td><td><b>${r.nota}</b></td><td>${r.ok}/${r.n}</td><td><button class="btn g" style="margin:0;padding:4px 8px" onclick="del(${i})">✕</button></td></tr>`).join('')}
function del(i){if(confirm('¿Borrar este resultado?')){S.res.splice(i,1);save();table()}}
$('bcsv').onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const rows=[['Evaluación','Estudiante','Aciertos','Total','Nota','Respuestas','Fecha'],...S.res.map(r=>[r.exam,r.name,r.ok,r.n,r.nota,r.ans,r.date])];
 const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='resultados.csv';a.click()};
refresh();
</script></body></html>
